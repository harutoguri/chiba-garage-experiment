    <script>
      (function() {
        var t0 = performance.now();
        // ★ v87b: head_start タイミング — HTML DL完了の指標
        window.__t_head_start = t0;
        window.__t_early_fetch_fire = t0; // fetch開始≒head script実行

        // ★ 3u27: 在庫一覧ホーム(/)以外ではearly fetchスキップ（帯域節約）
        var _ep = location.pathname;
        if (_ep !== '/') {
          window.__earlyListWithMediaData = null;
          window.__earlyListWithMediaPromise = Promise.resolve(null);
          console.log('[EarlyFetch] SKIP — non-vehicle page: ' + _ep);
          return;
        }

        // ★ 二重fetch排除: サーバーが__earlyListWithMediaDataを埋め込み済みならAPI fetchスキップ
        if (window.__earlyListWithMediaData) {
          console.log('[EarlyFetch] listWithMedia SKIP — server-embedded (' + (window.__earlyListWithMediaData.vehicles ? window.__earlyListWithMediaData.vehicles.length : 0) + ' vehicles)');
          window.__earlyListWithMediaTime = 0;
          window.__earlyListWithMediaPromise = Promise.resolve(window.__earlyListWithMediaData);
          // firstVideoも埋め込みデータから導出
          var result = window.__earlyListWithMediaData;
          if (result && result.vehicles && result.mediaMap) {
            for (var i = 0; i < result.vehicles.length; i++) {
              var v = result.vehicles[i];
              var media = result.mediaMap[v.id];
              if (!media) continue;
              var sorted = media.slice().sort(function(a, b) { return (a.displayOrder || 0) - (b.displayOrder || 0); });
              for (var j = 0; j < sorted.length; j++) {
                if (sorted[j].type === 'video' && sorted[j].bunnyVideoId) {
                  window.__earlyFirstBunnyId = sorted[j].bunnyVideoId;
                  window.__earlyVideoUrl = '/api/sdr/' + sorted[j].bunnyVideoId + '?v=5';
                  break;
                }
              }
              if (window.__earlyFirstBunnyId) break;
            }
          }
        } else {
          // サーバー埋め込みなし（dev mode等）→ 従来通りfetch
          var BUNNY_CDN = '';
          window.__earlyListWithMediaPromise = fetch('/api/trpc/vehicles.listWithMedia?input=%7B%22json%22%3Anull%2C%22meta%22%3A%7B%22values%22%3A%5B%22undefined%22%5D%7D%7D')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var result = data && data.result && data.result.data && data.result.data.json;
              window.__earlyListWithMediaData = result || null;
              window.__earlyListWithMediaTime = performance.now() - t0;
              console.log('[EarlyFetch] listWithMedia done +' + window.__earlyListWithMediaTime.toFixed(0) + 'ms');
              if (result && result.vehicles && result.mediaMap) {
                for (var i = 0; i < result.vehicles.length; i++) {
                  var v = result.vehicles[i];
                  var media = result.mediaMap[v.id];
                  if (!media) continue;
                  var sorted = media.slice().sort(function(a, b) { return (a.displayOrder || 0) - (b.displayOrder || 0); });
                  for (var j = 0; j < sorted.length; j++) {
                    if (sorted[j].type === 'video' && sorted[j].bunnyVideoId) {
                      var vid = sorted[j].bunnyVideoId;
                      window.__earlyFirstBunnyId = vid;
                      window.__earlyVideoUrl = '/api/sdr/' + vid + '?v=5';
                      console.log('[early] firstVideo vid=' + vid.slice(0,8) + ' (blob fetch from head)');
                      break;
                    }
                  }
                  if (window.__earlyFirstBunnyId) break;
                }
              }
              return result;
            })
            .catch(function(e) {
              console.log('[EarlyFetch] listWithMedia failed', e);
              window.__earlyListWithMediaData = null;
              return null;
            });

      })();

    <script>

          // cold-timing ct()が利用可能なら使う
          if (window.__coldTimingCt) window.__coldTimingCt('LOAD_DIAG', msg);

          } catch {}

        window.addEventListener('DOMContentLoaded', function() { _diagLog('DOMContentLoaded'); });
        window.addEventListener('load', function() {
          _loadFired = true;
          _diagLog('LOAD_EVENT_FIRED +' + performance.now().toFixed(0) + 'ms');
        });

        // 10秒チェック
        setTimeout(function() {
          if (_loadFired) { _diagLog('load OK within 10s'); return; }
          _diagLog('LOAD_NOT_FIRED_10s');
          var vids = document.querySelectorAll('video');

          for (var i = 0; i < Math.min(vids.length, 5); i++) {

          var imgs = document.querySelectorAll('img');
          var pending = 0; var pendingList = [];
          for (var i = 0; i < imgs.length; i++) {
            if (!imgs[i].complete) { pending++; if (pendingList.length < 5) pendingList.push(imgs[i].src.slice(-50)); }
          }
          _diagLog('imgs_total=' + imgs.length + ' pending=' + pending);
          for (var i = 0; i < pendingList.length; i++) { _diagLog('img_pending: ' + pendingList[i]); }
          if (window.__earlyVideo) { _diagLog('earlyVideo_EXISTS rs=' + window.__earlyVideo.readyState); }
        }, 10000);

        // 30秒チェック

    <script>
      (function() {
        var _sent = false;
        function _captureNet() {
          if (_sent) return;
          _sent = true;
          try {
            var entries = performance.getEntriesByType('resource');
            var data = entries.map(function(e) {
              return {
                name: e.name,
                type: e.initiatorType,
                start: Math.round(e.startTime),
                dur: Math.round(e.duration),
                size: e.transferSize || 0,
                encoded: e.encodedBodySize || 0,
                decoded: e.decodedBodySize || 0,
                dns: Math.round(e.domainLookupEnd - e.domainLookupStart),
                tcp: Math.round(e.connectEnd - e.connectStart),
                ttfb: Math.round(e.responseStart - e.requestStart),
                dl: Math.round(e.responseEnd - e.responseStart)
              };
            });
            var nav = performance.getEntriesByType('navigation')[0] || {};
            var payload = {
              ts: new Date().toISOString(),
              ua: navigator.userAgent.slice(0, 120),
              url: location.href,
              entryCount: entries.length,
              navTiming: {
                domContentLoaded: Math.round(nav.domContentLoadedEventEnd || 0),
                loadEvent: Math.round(nav.loadEventEnd || 0),
                domInteractive: Math.round(nav.domInteractive || 0),
                transferSize: nav.transferSize || 0
              },
              entries: data
            };
            fetch('/api/net-capture', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).then(function(r) { return r.json(); }).then(function(j) {
              console.log('[net-capture] sent ' + data.length + ' entries, server: ' + JSON.stringify(j));
            }).catch(function(e) { console.warn('[net-capture] failed', e); });
          } catch(e) { console.warn('[net-capture] error', e); }
        }
        // ページロード完了の3秒後に送信（遅延リソースも拾うため）
        window.addEventListener('load', function() { setTimeout(_captureNet, 3000); });
        // 15秒でも送信（loadイベントが遅い場合のフォールバック）
        setTimeout(_captureNet, 15000);
      })();
    </script>
    <script>
      // ★ v92e: HLS SW撤去 — 既存SWをunregister
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
          if (regs.length) console.log('[v92e] unregistered ' + regs.length + ' SW(s)');
        });
      }
    </script>
  </body>
